[project]
name = "datos"
version = "0.1.0"
description = "Backend and data pipeline of the regional news context portal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest uses bare asserts by design.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
# Test folders have no __init__.py: module names come from their path, so two
# conftest.py files do not collide.
explicit_package_bases = true

[[tool.mypy.overrides]]
# feedparser ships no type information. Its output is checked value by value at the
# boundary (src/datos/news/infrastructure/rss_feed_source.py), never trusted as typed.
module = "feedparser"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `datasets` is only imported by the real SetFit test.
module = "datasets"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# SetFit ships no type information, and torch is absent where the ml group is not installed (CI). The predictor reads its model through a Protocol
# (src/datos/classification/infrastructure/setfit_predictor.py), never as typed SetFit objects.
module = ["setfit", "setfit.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not ml' --strict-markers"
markers = [
    "integration: needs Docker (Testcontainers)",
    "ml: needs the `ml` group and downloads the encoder (`uv run pytest -m ml`)",
]

[tool.uv]
# Versions of packages that only the `ml` group pulls in, bounded to what was published more than
# two weeks before 2026-10-15 (the same rule as the web app's package manager). A global
# `exclude-newer` does not resolve for every Python the project supports. Revisit on each lock update.
constraint-dependencies = [
    "aiohttp<3.14.4",
    "cuda-bindings<13.4.4",
    "cuda-pathfinder<1.8.3",
    "filelock<4",
    "hf-xet<1.7.0",
    "multidict<7.1.0",
    "narwhals<2.27.1",
    "pyarrow<26.0.0",
]
# `geo` (shapely) only builds data/geo/; installed by default for local work and CI.
default-groups = ["dev", "geo"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]
geo = [
    "shapely>=2.1",
    "types-shapely>=2.1.0.20260728",
]
ml = [
    "datasets<5",
    "huggingface-hub<1",
    "sentence-transformers[train]<6",
    "setfit==1.2.0",
    "transformers<5",
]
